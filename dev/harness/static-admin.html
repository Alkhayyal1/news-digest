<script type="importmap">
{ "imports": {
  "node:sqlite": "/dev/harness/node/sqlite.js", "node:fs": "/dev/harness/node/fs.js", "node:fs/promises": "/dev/harness/node/fs-promises.js",
  "node:path": "/dev/harness/node/path.js", "node:url": "/dev/harness/node/url.js", "node:os": "/dev/harness/node/os.js",

} }

<body>
  <header class="top"><div class="wrap"><nav class="main" id="tabs"></nav>
    <a class="brand" href="#/">نشرة <span>الموثوق</span></a>
    <nav class="main" aria-label="التنقل الرئيسي">
      <a href="#/" data-nav="home">آخر نشرة</a><a href="#/archive" data-nav="archive">الأرشيف</a><a href="#/search" data-nav="search">البحث</a>
      <a href="#/companies" data-nav="companies">شركات تداول</a><a href="#/sources" data-nav="sources">المصادر والتغطية</a>
    </nav>
    <button class="icon-btn" id="theme-toggle" type="button" aria-label="تبديل الوضع الليلي">◐</button>
  </div></header>
  <main class="wrap" id="app"><p class="sub">بناء النسخة الثابتة داخل المتصفح…</p></main>
<script type="module">
import { boot } from '/dev/harness/boot.js';
import { files } from '/dev/harness/shims.js';
for (const f of ['/src/core/arabic.js', ...['index.html', 'admin.html', 'styles.css', 'app.js', 'admin.js', 'common.js', 'theme.js', 'favicon.svg', 'static-search.js'].map((x) => '/public/' + x)]) files.set(f, await (await fetch(f)).text());
const { db, fetchImpl, runUpdate } = await boot();
await runUpdate(db, { kind: 'manual', fetchImpl });
const { buildSite } = await import('/src/static/build.js');
window.__stats = buildSite(db, '/site');
const realFetch = window.fetch.bind(window);
// the built site's data/ files live in the virtual FS
window.fetch = async (input, init) => {
  const url = typeof input === 'string' ? input : input.url;
  if (url.startsWith('data/')) {
    const body = files.get('/site/' + url);
    return body === undefined ? new Response('', { status: 404 }) : new Response(body, { headers: { 'content-type': 'application/json' } });
  }
  return realFetch(input, init);
};
window.__files = files;
await import('/public/theme.js');
await import('/public/admin.js');
</script>
</body>
</html>
