globalThis.Buffer = { isBuffer: () => false, from: (s) => ({ length: String(s).length, toString: () => String(s) }), concat: (a) => ({ toString: () => a.map((x) => new TextDecoder().decode(x)).join('') }) };
</script>

{ "imports": {
  "node:sqlite": "/dev/harness/node/sqlite.js", "node:fs": "/dev/harness/node/fs.js", "node:fs/promises": "/dev/harness/node/fs-promises.js",

  <header class="top">
    <div class="wrap">
      <a class="brand" href="#/">نشرة <span>الموثوق</span></a>
      <nav class="main" aria-label="التنقل الرئيسي">
        <a href="#/" data-nav="home">آخر نشرة</a>

    </div>
  </header>
  <main class="wrap" id="app"><p class="sub">تشغيل الخلفية داخل المتصفح على نسخ محلية من الخلاصات الحقيقية…</p></main>
<script type="module">
import { boot } from '/dev/harness/boot.js';
const { db, fetchImpl, runUpdate } = await boot();
await runUpdate(db, { kind: 'manual', fetchImpl });
const { createApp } = await import('/src/server.js');
const handler = createApp(db, { fetchImpl });
const realFetch = window.fetch.bind(window);
window.fetch = async (input, init = {}) => {
  const url = typeof input === 'string' ? input : input.url;
  if (!url.startsWith('/api/')) return realFetch(input, init);
  const headers = Object.fromEntries(Object.entries(init.headers || {}).map(([k, v]) => [k.toLowerCase(), v]));
  const body = init.body ? [new TextEncoder().encode(init.body)] : [];
  const req = { url, method: init.method || 'GET', headers, socket: { remoteAddress: '127.0.0.1' }, async *[Symbol.asyncIterator]() { yield* body; } };
  return new Promise((resolve) => {
    const res = { _h: {}, setHeader(k, v) { this._h[k] = v; }, writeHead(s, h) { this._s = s; Object.assign(this._h, h); }, end(b) { resolve(new Response(b ?? '', { status: this._s || 200, headers: this._h })); } };
    handler(req, res);
  });
};
window.__db = db;
await import('/public/theme.js');
await import('/public/app.js');
</script>
</body>
