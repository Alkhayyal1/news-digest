# Fly.io deployment. Replace the app name, then see README (section النشر).
app = "CHANGE-ME-news-digest"
primary_region = "fra"

[build]

[env]
  PORT = "8080"
  DB_PATH = "/data/news.db"
  SCHEDULER_ENABLED = "true"
  INTERVAL_HOURS = "7"

[mounts]
  source = "news_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # The in-process scheduler needs the machine to stay up: never auto-stop.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "60s"
    method = "GET"
    path = "/api/sections"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
